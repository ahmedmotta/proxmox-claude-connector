[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "proxmox-claude-connector"
version = "0.1.0"
description = "Give Claude full, audited control of Proxmox VE as a remote MCP connector (claude.ai web, desktop and mobile)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Innovation IT Hub" }]
keywords = ["proxmox", "pve", "mcp", "claude", "model-context-protocol", "homelab", "virtualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "paramiko>=3.4",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
pve-connector = "pve_connector.__main__:main"

[project.urls]
Homepage = "https://innithub.online"

[tool.hatch.build.targets.wheel]
packages = ["src/pve_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/pve_connector/auth.py" = ["E501"]  # embedded SQL and CSS

[tool.ruff.lint.isort]
known-first-party = ["pve_connector", "conftest"]

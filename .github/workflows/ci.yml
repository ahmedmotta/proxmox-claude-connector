name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning deploy/*.sh gui/*.sh
      - run: node --check gui/claude-connector.js
      - run: node --check gui/theme/claude-theme.js gui/theme/dist/claude-theme.js
      - name: Theme files are committed and match their checksums
        run: |
          test -z "$(git check-ignore gui/theme/dist/SHA256SUMS)"
          cd gui/theme/dist && sha256sum --strict -c SHA256SUMS
      - name: Theme dist/ is up to date with its sources
        run: |
          python3 gui/theme/build.py
          git status --porcelain gui/theme/dist
          test -z "$(git status --porcelain gui/theme/dist)"
